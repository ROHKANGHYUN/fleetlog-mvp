<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleetlog UI 검증 · 격리된 메모리</title>
<style>body{margin:16px;font:16px system-ui;background:#e9eef1;color:#152b39}button{min-height:44px;margin:4px;padding:8px 12px}iframe{display:block;border:1px solid #879ba5;background:white;max-width:none}pre{white-space:pre-wrap;font:13px monospace;max-height:100px;overflow:auto}header{max-width:1280px}</style>
<header><h1>Fleetlog UI 검증 · 메모리 전용</h1><p>기존 브라우저 기록과 서버 DB를 사용하지 않습니다. 앱과 실제 controller를 그대로 렌더링합니다. 서버 응답은 모의입니다.</p>
<div><button data-size="1280,720">1280 × 720</button><button data-size="960,540">960 × 540</button><button data-size="640,720">640 × 720</button><button id="storage">저장 실패 모의 켜기</button><button id="network">전송·조회 실패 모의 켜기</button><button id="conflict">버전 충돌 모의 켜기</button><button id="measure">레이아웃 측정</button><button id="matrix">세 크기 모두 측정</button><button id="export">검증 결과 저장</button></div><pre id="report" aria-live="polite">검증 화면 로드 중</pre></header>
<iframe id="frame" title="검증용 Fleetlog 앱" src="frame.html" width="1280" height="720"></iframe>
<script type="module">
const frame=document.querySelector('#frame'), report=document.querySelector('#report');
let storage=false,network=false,conflict=false;let pendingMeasure=null;const matrixResults=[];const observations=[];
for(const button of document.querySelectorAll('[data-size]')) button.onclick=()=>{const [w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;};
for(const id of ['storage','network','conflict']) document.querySelector('#'+id).onclick=()=>{if(id==='storage')storage=!storage;if(id==='network')network=!network;if(id==='conflict')conflict=!conflict;const enabled={storage,network,conflict}[id];document.querySelector('#'+id).textContent={storage:'저장 실패',network:'전송·조회 실패',conflict:'버전 충돌'}[id]+' 모의 '+(enabled?'끄기':'켜기');frame.contentWindow.postMessage({type:'faults',storage,network,conflict},location.origin);};
document.querySelector('#measure').onclick=()=>frame.contentWindow.postMessage({type:'measure'},location.origin);
document.querySelector('#matrix').onclick=async()=>{const button=document.querySelector('#matrix');button.disabled=true;for(const [w,h] of [[1280,720],[960,540],[640,720]]){const measured=new Promise(resolve=>pendingMeasure={size:`${w}×${h}`,resolve});frame.width=w;frame.height=h;requestAnimationFrame(()=>requestAnimationFrame(()=>frame.contentWindow.postMessage({type:'measure'},location.origin)));const r=await measured;matrixResults.push({screen:r.screen,view:r.view,driving:r.driving,size:r.viewport,horizontalOverflow:r.horizontalOverflow,smallControls:r.undersizedVehicleControls,overflowingElements:r.overflowingVehicleElements});}button.disabled=false;frame.contentWindow.postMessage({type:'measure'},location.origin);};
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({matrixResults,observations},null,2)],{type:'application/json'}));a.download='fleetlog-step2-browser-results.json';a.click();URL.revokeObjectURL(a.href);};
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.type==='report'){if(pendingMeasure&&e.data.value.viewport===pendingMeasure.size){const resolve=pendingMeasure.resolve;pendingMeasure=null;resolve(e.data.value);}const r=e.data.value;observations.push(r);report.textContent=`${r.viewport} / ${r.view} / state=${r.screen} / active=${r.active} / saved=${r.saved} / queue=${r.queued}\n가로 넘침: ${r.horizontalOverflow}, 작은 버튼: ${JSON.stringify(r.undersizedVehicleControls)}, 차량 넘침: ${JSON.stringify(r.overflowingVehicleElements)}\n초안: ${JSON.stringify(r.draft)}, 종료 후보: ${JSON.stringify(r.candidateEnd)}\n오류 안내: ${r.actionAlert}\n`+matrixResults.slice(-3).map(m=>`${m.size}: 넘침=${m.horizontalOverflow}, 작은버튼=${m.smallControls.length}, 차량넘침=${m.overflowingElements.length}`).join('\n');}});
</script></html>
